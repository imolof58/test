<!DOCTYPE html>
<html lang="en">
<head>
  
  <title>Frontend Mentor | Profile card component</title>
  <link rel="stylesheet" href="css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <div class="container">
    <div class="card">
      
       <img class="profileimg" src="../profile-card-component-main/images/image-victor.jpg" alt="photo">
   
       <div class="profileinfo">

         <div>
            <p>Victor Crest<span class="age">26</span></p>
            <p class="comment">London</p>
         </div>

         <div>
            <p>80K</p>
            <p class="comment2">Followers</p>
         </div>

         <div>
            <p>803K</p> 
            <p class="comment2">Likes</p>
         </div>
       
         <div>
            <p>1.4K</p>
            <p class="comment2">Photos</p>
         </div>

       </div>
     </div>
  </div>

</body>
</html>
